# Runs the pytest suite on every pull request and on every push to main.
# The tests use tiny in-memory examples, so no dataset download or GPU is needed.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read  # the workflow only needs to read the code

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Needed by the SentencePiece test; without it that test would be skipped.
          pip install sentencepiece
          # CPU build of torch (small, no GPU needed) so the LSTM and Transformer tests run
          # instead of being skipped.
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run tests
        # -rs prints the reason for every skipped test, so a skip never goes unnoticed.
        run: python -m pytest -v -rs
